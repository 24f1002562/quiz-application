{% extends "layout.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="container">
  <h1 class="text-center">Dashboard</h1>
  <div class="row">
    <div class="col-md-6">
      <h2>Profile</h2>
      <p><strong>Name:</strong> {{ user.name }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>DOB:</strong> {{ user.dob }}</p>
      <p><strong>Qualification:</strong> {{ user.qualification }}</p>
    </div>
    <div class="col-md-6">
      <h2>Actions</h2>
      <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
  </div>
</div>
{% endblock %}
<!-- In the above snippet, we have a Jinja template that extends layout.html and has a block content. The content block has a container with a row that has two columns. The first column displays the user's profile information, and the second column has a logout button. -->
