{% extends "admin/admin_layout.html" %}
{% block title %}Edit Question{% endblock %}
{% block admin_content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Edit Question</h1>
    <div class="btn-toolbar">
        <a href="{{ url_for('admin.view_quiz', quiz_id=question.quiz_id) }}" class="btn btn-secondary">Back to Quiz</a>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-12">
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0">Question Details</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin.edit_question', question_id=question.id) }}">
                    <div class="mb-3">
                        <label for="que" class="form-label">Question</label>
                        <textarea class="form-control" id="que" name="que" rows="2" required>{{ question.quest }}</textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="option1" class="form-label">Option A</label>
                            <input type="text" class="form-control" id="option1" name="option1" value="{{ question.option1 }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="option2" class="form-label">Option B</label>
                            <input type="text" class="form-control" id="option2" name="option2" value="{{ question.option2 }}" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="option3" class="form-label">Option C</label>
                            <input type="text" class="form-control" id="option3" name="option3" value="{{ question.option3 }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="option4" class="form-label">Option D</label>
                            <input type="text" class="form-control" id="option4" name="option4" value="{{ question.option4 }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Correct Answer</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="answer" id="answer1" value="option1" {% if question.answer == 'option1' %}checked{% endif %} required>
                                <label class="form-check-label" for="answer1">
                                    Option A
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="answer" id="answer2" value="option2" {% if question.answer == 'option2' %}checked{% endif %}>
                                <label class="form-check-label" for="answer2">
                                    Option B
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="answer" id="answer3" value="option3" {% if question.answer == 'option3' %}checked{% endif %}>
                                <label class="form-check-label" for="answer3">
                                    Option C
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="answer" id="answer4" value="option4" {% if question.answer == 'option4' %}checked{% endif %}>
                                <label class="form-check-label" for="answer4">
                                    Option D
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('admin.view_quiz', quiz_id=question.quiz_id) }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock admin_content %}
