{% extends "layout.html" %}
{% block title %}Edit Quiz{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Edit Quiz</h2>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin.edit_quiz', quiz_id=quiz.id) }}">
                        <div class="mb-3">
                            <label for="title" class="form-label">Quiz Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ quiz.title }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ quiz.description }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="time_duration" class="form-label">Duration (minutes)</label>
                            <input type="number" class="form-control" id="time_duration" name="time_duration" min="5" max="180" value="{{ quiz.time_duration }}" required>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('admin.view_quiz', quiz_id=quiz.id) }}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
