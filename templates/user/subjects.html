{% extends "layout.html" %}
{% block title %}Subjects{% endblock %}

{% block content %}
<div class="container mt-4">
    <!-- Add search bar -->
    <div class="search-section mb-4">
        <form action="{{ url_for('views.search') }}" method="GET" class="mb-4">
            <input type="hidden" name="type" value="subjects">
            <div class="row g-3">
                <div class="col-md-10">
                    <input type="text" name="query" class="form-control form-control-lg" 
                           placeholder="Search subjects...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Search</button>
                </div>
            </div>
        </form>
    </div>

    <h2 class="mb-4">Available Subjects</h2>
    
    <div class="row">
        {% for subject in subjects %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ subject.name }}</h5>
                    <p class="card-text">{{ subject.description }}</p>
                    <a href="{{ url_for('views.subject_chapters', subject_id=subject.id) }}" 
                       class="btn btn-primary">View Chapters</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
