{% extends "layout.html" %} {% block title %}Home{% endblock %} {% block content
%}
<style>
  /* General Styles */
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #fff;
    text-align: center;
  }

  /* Hero Section */
  .hero {
    background: url("https://source.unsplash.com/random/1600x900?dark")
      no-repeat center center/cover;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
  }

  .hero h1 {
    font-size: 3rem;
    margin: 0;
  }

  .hero p {
    font-size: 1.5rem;
    margin: 10px 0;
  }

  /* Buttons */
  .buttons {
    margin-top: 20px;
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    margin: 10px;
    color: #fff;
    background-color: #e50914;
    text-decoration: none;
    border-radius: 5px;
    font-size: 1.2rem;
    transition: 0.3s;
  }

  .btn:hover {
    background-color: #b20710;
  }

  /* Gallery Section */
  .gallery {
    padding: 50px 20px;
  }

  .gallery h2 {
    font-size: 2.5rem;
    margin-bottom: 20px;
  }

  .image-grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  .image-grid img {
    width: 300px;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    transition: 0.3s;
  }

  .image-grid img:hover {
    transform: scale(1.1);
  }

  /* About Section */
  .about {
    padding: 50px 20px;
    background-color: #1e1e1e;
  }

  .about h2 {
    font-size: 2rem;
  }

  /* Footer */
  footer {
    padding: 20px;
    background-color: #000;
  }
</style>
<header class="hero">
  <div class="hero-content">
    <h1>Welcome to Quiz-Master</h1>
    <p>Your one-stop destination for amazing experiences.</p>
    <div class="buttons">
      <a href="{{ url_for('auth.login') }}" class="btn">Login</a>
      <a href="{{ url_for('auth.register') }}" class="btn">Register</a>
    </div>
  </div>
</header>

<footer>
  <p>© 2025 Our Platform. All rights reserved.</p>
</footer>

{% endblock %}
