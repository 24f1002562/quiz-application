{% extends "layout.html" %} {% block title %}Register{% endblock %} {% block
content %}
<div class="container">
  <h1 class="text-center">Register</h1>
  <form action="/register" method="POST">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" name="name" required />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        required
      />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="password"
        required
      />
    </div>
    <div class="mb-3">
      <label for="date" class="form-label">DOB</label>
      <input
        type="date"
        class="form-control"
        id="date"
        name="dob"
        required
        max="{{ current_year }}-12-31"
      />
    </div>
    <div class="mb-3">
      <label for="qualification" class="form-label">Qualification</label>
      <input
        type="text"
        class="form-control"
        id="qualification"
        name="qualification"
        required
      />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Confirm Password</label>
      <input
        type="password"
        class="form-control"
        id="password"
        name="cp"
        required
      />
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <p class="mt-3">Already have an account? <a href="/login">Login now</a></p>
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
  </form>
</div>
{% endblock %}
